<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>인사고과 체험판</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-title" content="인사고과">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <style>
    html, body { margin: 0; height: 100%; background: #f5f5f2; color: #1f2328;
      font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    #views { position: fixed; inset: 0; }
    #views iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #f5f5f2; }
    #views iframe.pending { visibility: hidden; }
    #busy { position: fixed; top: 0; left: 0; z-index: 30; height: 3px; width: 0; background: #1c5cab; opacity: 0; }
    #busy.on { opacity: 1; width: 80%; transition: width 4s cubic-bezier(.1, .7, .2, 1); }
    #splash { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 14px; padding: 24px; text-align: center; background: #f5f5f2; }
    #splash[hidden] { display: none; }
    #splash img { width: 72px; height: 72px; }
    #splash .title { font-size: 18px; font-weight: 700; }
    #status { font-size: 14px; color: #57606a; min-height: 20px; }
    #splash.error #status { color: #b42318; }
    .bar { width: min(260px, 70vw); height: 6px; border-radius: 3px; background: #dfe3e8; overflow: hidden; }
    .bar span { display: block; height: 100%; width: 0; background: #1c5cab; transition: width .3s; }
    .note { font-size: 12.5px; color: #57606a; max-width: 300px; line-height: 1.5; }
    button { font: inherit; font-size: 14px; padding: 8px 16px; border-radius: 6px; border: 1px solid #1c5cab;
      background: #1c5cab; color: #fff; }
    #update { position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 25; display: flex; align-items: center;
      justify-content: space-between; gap: 12px; padding: 10px 14px; border-radius: 8px; background: #1f2328;
      color: #fff; font-size: 14px; box-shadow: 0 4px 16px rgba(0, 0, 0, .2); }
    #update[hidden] { display: none; }
    #update button { background: #fff; color: #1f2328; border-color: #fff; padding: 6px 12px; }
  </style>
</head>
<body>
  <div id="views"></div>
  <div id="busy"></div>
  <div id="splash">
    <img src="icons/icon-192.png" alt="">
    <div class="title">인사고과 체험판</div>
    <div id="status" role="status">불러오는 중…</div>
    <div class="bar"><span id="progress"></span></div>
    <div class="note">처음 한 번은 앱 파일(약 24MB)을 받습니다. 그 뒤로는 인터넷 없이 열리고,
      입력한 자료는 이 기기에만 저장됩니다.</div>
    <button id="retry" type="button" hidden>다시 시도</button>
  </div>
  <div id="update" hidden><span>새 버전이 준비됐습니다.</span><button type="button">지금 반영</button></div>
  <script src="shell.js"></script>
</body>
</html>
